name: Python smoke
on:
  pull_request:
  push:
    branches: [main]

jobs:
  isolated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check maintained entrypoint
        run: python -m compileall -q launcher.py velisara_agent tests
      - name: Synthetic boot safety tests
        run: python -m unittest discover -s tests -v
